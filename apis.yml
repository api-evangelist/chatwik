aid: chatwik
name: Chatwik
description: >-
  Modern omnichannel customer communication platform (operated by ZeroFlux Technologies) combining live chat, social
  media messaging, a multi-agent shared inbox, CRM workspace, and the WikAI autonomous AI support assistant. Built on a
  Chatwoot-derived application stack, it consolidates Website chat, WhatsApp, Facebook, Instagram, Telegram, SMS, Voice,
  Email, LINE, TikTok and X into a single shared inbox. Currently exposes an llms.txt / llms-full.txt agent-native
  discovery file, a served security.txt, and an embeddable JavaScript Widget SDK; a REST/webhook developer API is
  advertised on the integrations page but is not yet documented (the /docs API Reference link 404s).
